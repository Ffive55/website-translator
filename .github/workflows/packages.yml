name: Prepare source snapshot

# Manual preparation only: no Release creation, push, or browser ZIP packaging.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: git diff --exit-code -- edge
      - run: npm run prepare:github
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: website-translator-reviewed-source
          path: .cache/github-ready/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
