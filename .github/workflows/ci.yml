name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run prepare:github -- --check
      - name: Verify committed Edge build
        run: git diff --exit-code -- edge
